name: CI

# Android-only. This fork does not maintain the inherited iOS app, so the upstream
# ios-compile job (which burned a macOS runner on every push) and the iOS/Android
# version-consistency check have both been removed — the latter would fail the first
# time the Android version is bumped on its own, which is exactly what we intend to do.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure release binaries are not tracked
        run: |
          tracked="$(git ls-files '*.ipa' '*.apk' '*.aab')"
          if [ -n "$tracked" ]; then
            echo "Release binaries must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Ensure the update check has not been hardcoded again
        run: |
          # The in-app updater must stay driven by buildConfigField and default to empty,
          # so that forks of this repo do not phone home to us the way we did to upstream.
          if grep -rnE 'https://(raw\.githubusercontent\.com|github\.com)/[^"]*/(app-version\.json|releases)' \
               HomelabAndroid/app/src/main --include='*.kt'; then
            echo "Update URLs must come from BuildConfig, not string literals."
            exit 1
          fi

  android:
    name: Android compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: HomelabAndroid
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.1.0

      - name: Compile debug sources
        run: ./gradlew :app:compileDebugKotlin --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Instrumented tests need a device, so CI only proves they still compile.
      # Run them locally with: ./gradlew connectedDebugAndroidTest
      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain
